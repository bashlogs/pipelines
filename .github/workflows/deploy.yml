name: Deploy to AKS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------------- Checkout ----------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- Azure Login ----------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---------------- Connect to AKS ----------------
      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      # ---------------- Setup Helm ----------------
      - name: Setup Helm
        uses: azure/setup-helm@v4

      # ---------------- Deploy to AKS using Helm ----------------
      - name: Deploy with Helm
        run: |
          helm upgrade --install myapp ./charts/myapp \
            --set backend.image.repository=ghcr.io/${{ github.repository }}-backend \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.repository=ghcr.io/${{ github.repository }}-frontend \
            --set frontend.image.tag=${{ github.sha }} \
            --set backend.env.MONGO_URI="${{ secrets.MONGO_URI }}" \
            --set frontend.env.REACT_APP_BACKEND_URL="${{ secrets.REACT_APP_BACKEND_URL }}" \
            --namespace default --create-namespace
