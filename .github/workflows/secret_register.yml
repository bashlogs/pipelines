name: Register AKS Secrets

on:
  workflow_dispatch:   # you can manually trigger it
  push:
    branches:
      - main

jobs:
  register-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Azure login using Service Principal credentials
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 2: Connect to AKS cluster context
      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      # Step 3: Create or update Kubernetes Secret named "myapp-secrets"
      - name: Register Kubernetes Secrets
        run: |
          kubectl create secret generic myapp-secrets \
            --from-literal=MONGO_URI="${{ secrets.MONGO_URI }}" \
            --from-literal=REACT_APP_BACKEND_URL="${{ secrets.REACT_APP_BACKEND_URL }}" \
            --dry-run=client -o yaml | kubectl apply -f -
